<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Öffentlicher Nahverkehr">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <circle cx="1010" cy="92" r="46" fill="#fde68a" opacity="0.9"/>
  <!-- skyline -->
  <g fill="#ffffff" opacity="0.10">
    <rect x="70" y="150" width="80" height="170"/>
    <rect x="170" y="110" width="64" height="210"/>
    <rect x="250" y="170" width="90" height="150"/>
    <rect x="360" y="130" width="60" height="190"/>
    <rect x="900" y="150" width="80" height="170"/>
    <rect x="1000" y="120" width="70" height="200"/>
    <rect x="1090" y="170" width="80" height="150"/>
  </g>
  <!-- ground -->
  <rect x="0" y="300" width="1200" height="120" fill="url(#road)"/>
  <g stroke="#ddd6fe" stroke-width="6" stroke-dasharray="34 26" opacity="0.6">
    <line x1="0" y1="372" x2="1200" y2="372"/>
  </g>

  <!-- Train (S-Bahn) -->
  <g transform="translate(120,196)">
    <rect x="0" y="0" width="250" height="104" rx="20" fill="#f8fafc"/>
    <rect x="0" y="0" width="250" height="104" rx="20" fill="#0ea5e9" opacity="0.12"/>
    <rect x="18" y="22" width="46" height="40" rx="8" fill="#bae6fd"/>
    <rect x="78" y="22" width="46" height="40" rx="8" fill="#bae6fd"/>
    <rect x="138" y="22" width="46" height="40" rx="8" fill="#bae6fd"/>
    <path d="M198 22 h34 a16 16 0 0 1 16 16 v24 h-50 z" fill="#bae6fd"/>
    <rect x="0" y="74" width="250" height="14" fill="#0284c7"/>
    <circle cx="60" cy="104" r="16" fill="#1e293b"/>
    <circle cx="190" cy="104" r="16" fill="#1e293b"/>
    <circle cx="60" cy="104" r="6" fill="#94a3b8"/>
    <circle cx="190" cy="104" r="6" fill="#94a3b8"/>
    <text x="30" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0369a1">S</text>
  </g>

  <!-- Tram (U12) -->
  <g transform="translate(470,180)">
    <rect x="0" y="0" width="270" height="120" rx="22" fill="#f8fafc"/>
    <rect x="0" y="0" width="270" height="120" rx="22" fill="#7c3aed" opacity="0.1"/>
    <rect x="16" y="26" width="54" height="46" rx="8" fill="#ddd6fe"/>
    <rect x="84" y="26" width="54" height="46" rx="8" fill="#ddd6fe"/>
    <rect x="152" y="26" width="54" height="46" rx="8" fill="#ddd6fe"/>
    <rect x="216" y="26" width="40" height="46" rx="8" fill="#ddd6fe"/>
    <rect x="0" y="84" width="270" height="16" fill="#6d28d9"/>
    <circle cx="70" cy="120" r="17" fill="#1e293b"/>
    <circle cx="200" cy="120" r="17" fill="#1e293b"/>
    <circle cx="70" cy="120" r="6" fill="#a78bfa"/>
    <circle cx="200" cy="120" r="6" fill="#a78bfa"/>
    <line x1="135" y1="-26" x2="135" y2="0" stroke="#c4b5fd" stroke-width="4"/>
    <text x="105" y="118" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">U12</text>
  </g>

  <!-- Bus -->
  <g transform="translate(820,206)">
    <rect x="0" y="0" width="240" height="94" rx="18" fill="#f8fafc"/>
    <rect x="0" y="0" width="240" height="94" rx="18" fill="#16a34a" opacity="0.12"/>
    <rect x="16" y="20" width="44" height="36" rx="7" fill="#bbf7d0"/>
    <rect x="72" y="20" width="44" height="36" rx="7" fill="#bbf7d0"/>
    <rect x="128" y="20" width="44" height="36" rx="7" fill="#bbf7d0"/>
    <rect x="184" y="20" width="40" height="36" rx="7" fill="#bbf7d0"/>
    <rect x="0" y="66" width="240" height="12" fill="#15803d"/>
    <circle cx="58" cy="94" r="15" fill="#1e293b"/>
    <circle cx="182" cy="94" r="15" fill="#1e293b"/>
    <circle cx="58" cy="94" r="5" fill="#86efac"/>
    <circle cx="182" cy="94" r="5" fill="#86efac"/>
    <text x="92" y="48" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">425</text>
  </g>
</svg>
